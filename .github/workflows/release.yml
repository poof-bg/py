name: Release

# Publishes to PyPI whenever a version tag is pushed (or a GitHub release is
# created, which pushes the tag). The tag must match the version in
# pyproject.toml, e.g. tag v0.2.0 for version = "0.2.0".
#
# Auth uses PyPI trusted publishing (OIDC), so no token is stored in GitHub.
# One-time setup on pypi.org: project "poofbg" -> Publishing -> add a GitHub
# publisher with owner "poof-bg", repository "py", workflow "release.yml",
# environment "pypi".

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check that the tag matches pyproject.toml
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml" >&2
            exit 1
          fi

      - name: Install
        run: uv pip install --system -e . pytest ruff mypy

      - name: Lint, type-check and test
        run: |
          ruff check src tests
          ruff format --check src tests
          mypy src
          pytest -q

      - name: Build sdist and wheel
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
